# Déploiement automatique : chaque push sur main déclenche un build Netlify (GitHub App).
# Le catalogue est régénéré depuis catalogue.xlsx à chaque build.
[build]
  command = "python3 -m venv /tmp/chezaida-venv && /tmp/chezaida-venv/bin/pip install --quiet openpyxl && /tmp/chezaida-venv/bin/python tools/excel_to_products.py catalogue.xlsx data/products.js"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
